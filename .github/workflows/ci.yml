name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: auth-service/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: auth-service

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api-gateway/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: api-gateway

  courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: course-service/course-service/pom.xml
      - run: chmod +x mvnw && ./mvnw -B test
        working-directory: course-service/course-service

  grades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Grade-Service/requirements.txt
            Grade-Service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: Grade-Service
      - run: pytest
        working-directory: Grade-Service

  students:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Service-Etudiant1/package-lock.json
      - run: npm ci
        working-directory: Service-Etudiant1
      - run: npm test
        working-directory: Service-Etudiant1

  billing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test -c Release
        working-directory: billing-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
