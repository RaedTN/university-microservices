server:
  port: 8088

# JWT Configuration (set JWT_SECRET in the environment; same value as auth and the student service)
jwt:
  secret: ${JWT_SECRET}

# Hosts default to localhost. Docker Compose sets the *_SERVICE_URL variables.
services:
  auth:
    url: "${AUTH_SERVICE_URL:http://localhost:8081}"
  students:
    url: "${STUDENT_SERVICE_URL:http://localhost:3000}"
  grades:
    url: "${GRADE_SERVICE_URL:http://localhost:8000}"
  courses:
    url: "${COURSE_SERVICE_URL:http://localhost:8082}"
  billing:
    url: "${BILLING_SERVICE_URL:http://localhost:5064}"

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth Service - login and register are public; other /auth paths require JWT
            - id: auth
              uri: "${AUTH_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/auth/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /api/auth/$\{segment}

            # Student Service - Protected (JWT required via GlobalFilter)
            - id: students
              uri: "${STUDENT_SERVICE_URL:http://localhost:3000}"
              predicates:
                - Path=/students/**
              filters:
                # Map /students and /students/... -> /api/students and /api/students/...
                - RewritePath=/students(?<segment>/?.*), /api/students$\{segment}

            # Grade Service - Protected (JWT required via GlobalFilter)
            - id: grades
              uri: "${GRADE_SERVICE_URL:http://localhost:8000}"
              predicates:
                - Path=/grades/**
              filters:
                - RewritePath=/grades/(?<segment>.*), /grades/$\{segment}

            # Course Service - SOAP (JWT required)
            - id: courses
              uri: "${COURSE_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/courses, /courses/**
              filters:
                # Rewrite /courses to /course-service (preserves query strings like ?wsdl)
                - RewritePath=/courses, /course-service
                # Rewrite /courses/** to /course-service/**
                - RewritePath=/courses/(?<segment>.*), /course-service/$\{segment}

            # Billing Service - SOAP (JWT required)
            - id: billing
              uri: "${BILLING_SERVICE_URL:http://localhost:5064}"
              predicates:
                - Path=/billing, /billing/**
              filters:
                # Rewrite /billing to /BillingService.svc (preserves query strings like ?wsdl)
                - RewritePath=/billing, /BillingService.svc
                # Rewrite /billing/** to /BillingService.svc/**
                - RewritePath=/billing/(?<segment>.*), /BillingService.svc/$\{segment}
