map $http_accept $spa_fallback {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same paths as the Vite dev proxy. A browser navigation sends text/html
    # and must stay in the SPA; a fetch does not, and goes to the gateway.
    location ~ ^/(auth|students|grades|rest|health|courses|billing)(/|$) {
        error_page 418 = @spa;
        if ($spa_fallback) {
            return 418;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $gateway_upstream gateway:8088;
        proxy_pass http://$gateway_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location @spa {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }
}
